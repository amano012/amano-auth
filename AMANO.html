<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AMANO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d0d0d;
      color: #ff4040;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }
    h1 {
      font-size: 80px;
      letter-spacing: 8px;
      text-shadow: 0 0 30px #ff0000;
      animation: glow 2s infinite alternate;
      font-weight: 800;
    }
    p {
      color: #888;
      letter-spacing: 6px;
      font-size: 14px;
      margin-top: 20px;
      text-transform: uppercase;
    }
    @keyframes glow {
      from { text-shadow: 0 0 20px #ff0000; }
      to   { text-shadow: 0 0 60px #ff0000, 0 0 90px #ff0000; }
    }
  </style>
</head>
<body>
  <h1>AMANO</h1>
  <p>Loading Menu...</p>
</body>
</html>
